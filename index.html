<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luiz Gabriel · Links</title>
  <style>
    :root {
      --bg: #120E27;
      --surface: #1D1840;
      --surface-2: #241C4E;
      --accent-magenta: #FF3D81;
      --accent-cyan: #22E6C5;
      --accent-yellow: #FFD23F;
      --text: #F5F3FF;
      --text-dim: #A79FD6;
    }

    * {
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: local('JetBrains Mono');
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 3;
    }

    /* --- gif de fundo (matrix/código) --- */
    .bg-video {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-video img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      filter: saturate(1.3);
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 61, 129, 0.18), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(34, 230, 197, 0.16), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255, 210, 63, 0.12), transparent 50%),
        linear-gradient(180deg, rgba(18, 14, 39, 0.65), rgba(18, 14, 39, 0.8) 40%, rgba(18, 14, 39, 0.92) 85%);
    }

    /* --- cascata de emojis --- */
    .emoji-rain {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .emoji-rain span {
      position: absolute;
      top: -10%;
      will-change: transform, opacity;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 0 6px rgba(34, 230, 197, 0.25));
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
        filter: blur(0px);
      }

      8% {
        opacity: 1;
      }

      70% {
        opacity: 1;
        filter: blur(0px);
      }

      100% {
        transform: translateY(115vh) rotate(25deg);
        opacity: 0;
        filter: blur(3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .emoji-rain {
        display: none;
      }
    }

    /* --- header / terminal signature --- */
    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06), 0 12px 30px -8px rgba(255, 61, 129, 0.5);
      opacity: 0;
      animation: rise 0.6s ease forwards;
      position: relative;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      overflow: hidden;
    }

    .avatar-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 22px;
      border: 2px solid var(--accent-cyan);
      animation: avatar-wave 6s ease-out infinite;
      pointer-events: none;
    }

    @keyframes avatar-wave {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }

      8% {
        opacity: 0.6;
      }

      35% {
        transform: scale(1.5);
        opacity: 0;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar::before {
        animation: none;
        display: none;
      }
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
      opacity: 0;
      animation: rise 0.6s ease forwards 0.08s;
    }

    .handle {
      text-align: center;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13px;
      color: var(--accent-cyan);
      margin: 0 0 18px;
      opacity: 0;
      animation: rise 0.6s ease forwards 0.14s;
    }

    .terminal {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13.5px;
      color: var(--text-dim);
      text-align: center;
      margin: 0 0 40px;
      opacity: 0;
      animation: rise 0.6s ease forwards 0.2s;
    }

    .terminal .prompt {
      color: var(--accent-yellow);
    }

    .terminal .typed::after {
      content: '';
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--accent-magenta);
      margin-left: 4px;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }

    /* --- link cards --- */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      --glow: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.5s ease forwards;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:nth-child(1) {
      animation-delay: 0.28s;
    }

    .card:nth-child(2) {
      animation-delay: 0.36s;
    }

    .card:nth-child(3) {
      animation-delay: 0.44s;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--glow);
      box-shadow: 0 10px 28px -10px var(--glow);
      outline: none;
    }

    .card.linkedin {
      --glow: #3f83e9;
    }

    .card.github {
      --glow: #FFD23F;
    }

    .card.whatsapp {
      --glow: #FF3D81;
    }

    .card.youtube {
      --glow: #FF0000;
    }

    .icon-wrap {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      color: var(--glow);
    }

    .icon-wrap svg {
      width: 22px;
      height: 22px;
    }

    .card-text {
      min-width: 0;
    }

    .card-title {
      font-weight: 600;
      font-size: 15px;
      margin: 0 0 2px;
    }

    .card-sub {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 12px;
      color: var(--text-dim);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      margin-left: auto;
      flex: 0 0 auto;
      color: var(--text-dim);
      font-size: 16px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .card:hover .arrow {
      transform: translateX(3px);
      color: var(--glow);
    }

    footer {
      text-align: center;
      margin-top: 44px;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0;
      animation: rise 0.5s ease forwards 0.55s;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .avatar,
      h1,
      .handle,
      .terminal,
      .card,
      footer {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      .terminal .typed::after {
        animation: none;
      }
    }
  </style>
</head>

    (function () {
      var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) return;

      var container = document.getElementById('emojiRain');
      var count = window.innerWidth < 480 ? 14 : 22;
      var emojis = ['💻', '🎤', '📷', '💙'];

      for (var i = 0; i < count; i++) {
        var el = document.createElement('span');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        var left = Math.random() * 100;
        var size = 16 + Math.random() * 22;
        var duration = 14 + Math.random() * 12;
        var delay = Math.random() * -duration;

        el.style.left = left + 'vw';
        el.style.fontSize = size + 'px';
        el.style.animationDuration = duration + 's';
        el.style.animationDelay = delay + 's';

        container.appendChild(el);
      }
    })();
  </script>
